<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meuseuraya Inklusi: Aplikasi Pemantauan Anak Neurodiversitas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans">

    <!-- Header Chatbot & Role Selector -->
    <header class="bg-indigo-700 text-white p-4 shadow-md flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <div class="w-10 h-10 rounded-full bg-indigo-900 flex items-center justify-center font-bold text-lg text-indigo-200">
                <i class="fa-solid fa-brain"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">Sistem Monitoring Perkembangan Siswa</h1>
                <p class="text-xs text-indigo-200">Workflow: Guru ➔ Psikolog (+AI) ➔ Orang Tua</p>
            </div>
        </div>

        <!-- Role Selector Tabs -->
        <div class="flex bg-indigo-800 p-1 rounded-xl text-xs w-full sm:w-auto justify-between sm:justify-start">
            <button id="btn-guru" onclick="switchRole('guru')" class="role-btn px-3 py-1.5 rounded-lg font-medium transition-all bg-white text-indigo-900 shadow">
                <i class="fa-solid fa-chalkboard-user mr-1"></i> 1. Guru
            </button>
            <button id="btn-psikolog" onclick="switchRole('psikolog')" class="role-btn px-3 py-1.5 rounded-lg font-medium transition-all text-indigo-100 hover:text-white">
                <i class="fa-solid fa-user-doctor mr-1"></i> 2. Psikolog + AI
            </button>
            <button id="btn-ortu" onclick="switchRole('ortu')" class="role-btn px-3 py-1.5 rounded-lg font-medium transition-all text-indigo-100 hover:text-white">
                <i class="fa-solid fa-house-chimney-user mr-1"></i> 3. Orang Tua
            </button>
        </div>
    </header>

    <!-- Role Status & Pipeline Banner -->
    <div id="roleBanner" class="bg-indigo-50 border-b border-indigo-100 px-4 py-2 text-xs text-indigo-800 flex items-center justify-between">
        <!-- Text dynamic based on active role & data state -->
    </div>

    <!-- Chat Area -->
    <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Message stream -->
    </main>

    <!-- Action Buttons -->
    <div id="quickReplies" class="px-4 py-2 bg-slate-50 border-t border-slate-200 flex gap-2 overflow-x-auto text-xs whitespace-nowrap scrollbar-none">
        <!-- Dynamic Buttons -->
    </div>

    <!-- Input Form -->
    <footer class="p-3 bg-white border-t border-slate-200">
        <form id="chatForm" onsubmit="handleSend(event)" class="flex gap-2 items-center">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Tulis pesan..." 
                class="flex-1 bg-slate-100 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                autocomplete="off"
            />
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white w-10 h-10 rounded-xl flex items-center justify-center shrink-0 transition-colors shadow-md active:scale-95">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <!-- Logic Engine & Database State -->
    <script>
        // Database State - KOSONG SAMA SEKALI SAAT AWAL (CLEAN STATE)
        let systemData = {
            metadata: {
                tanggal: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }),
                status_pipeline: "menunggu_guru" // "menunggu_guru" | "menunggu_psikolog" | "terkirim_ke_ortu"
            },
            observasi_guru: null, // Berisi JSON setelah guru menginput data
            analisis_psikolog: null // Berisi JSON setelah psikolog/AI menganalisis
        };

        let currentRole = 'guru';
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const roleBanner = document.getElementById('roleBanner');
        const quickReplies = document.getElementById('quickReplies');

        function initChat() {
            chatBox.innerHTML = '';
            updateRoleUI();
            
            if (currentRole === 'guru') {
                if (!systemData.observasi_guru) {
                    appendBotMessage(`
                        <strong>Selamat Datang, Guru / Coach! 👩‍🏫</strong><br>
                        Belum ada data laporan untuk hari ini. Silakan **masukkan atau ketik laporan observasi perkembangan siswa** pada kolom obrolan di bawah untuk memulai alur.
                    `, 'System');
                } else {
                    appendBotMessage(`
                        <strong>Laporan Hari Ini Sudah Disimpan! 📄</strong><br>
                        Anda telah berhasil menginput observasi. Data telah diteruskan ke tahap Psikolog.
                    `, 'Guru');
                }
            } else if (currentRole === 'psikolog') {
                if (!systemData.observasi_guru) {
                    appendBotMessage(`
                        <strong>Selamat Datang, Psikolog! 🧠</strong><br>
                        📌 <em>Status: Belum ada input dari Guru. Silakan minta Guru menginput laporan observasi terlebih dahulu.</em>
                    `, 'System');
                } else if (!systemData.analisis_psikolog) {
                    appendBotMessage(`
                        <strong>Input dari Guru Ditemukan! 📥</strong><br>
                        Guru telah menginput laporan observasi siswa. Klik tombol **"🤖 Analisis dengan AI"** di bawah untuk membuat draf analisis otomatis.
                    `, 'Psikolog');
                } else {
                    appendBotMessage(`
                        <strong>Analisis Psikologi Telah Selesai! 📊</strong><br>
                        Hasil analisis dan rekomendasi siap diteruskan ke Orang Tua.
                    `, 'Psikolog');
                }
            } else if (currentRole === 'ortu') {
                if (systemData.metadata.status_pipeline !== "terkirim_ke_ortu") {
                    appendBotMessage(`
                        <strong>Selamat Datang, Bapak/Ibu! 👨‍👩‍👦</strong><br>
                        📌 <em>Status: Laporan hari ini (${systemData.metadata.tanggal}) masih dalam proses peninjauan oleh Tim Guru & Psikolog. Mohon tunggu beberapa saat.</em>
                    `, 'System');
                } else {
                    appendBotMessage(`
                        <strong>Halo Bapak/Ibu! 🌸</strong><br>
                        Laporan perkembangan lengkap hari ini (${systemData.metadata.tanggal}) dari Guru dan Psikolog telah tersedia. Silakan klik tombol di bawah untuk membacanya.
                    `, 'Orang Tua');
                }
            }
        }

        function updateRoleUI() {
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.className = 'role-btn px-3 py-1.5 rounded-lg font-medium transition-all text-indigo-100 hover:text-white';
            });
            const activeBtn = document.getElementById(`btn-${currentRole}`);
            activeBtn.className = 'role-btn px-3 py-1.5 rounded-lg font-medium transition-all bg-white text-indigo-900 shadow';

            // Dynamic Action Bar based on Pipeline & Role
            if (currentRole === 'guru') {
                roleBanner.innerHTML = `<span><i class="fa-solid fa-chalkboard-user mr-1"></i> Mode <strong>Guru</strong>: Input Laporan Pertama.</span><span class="text-slate-400">${systemData.metadata.tanggal}</span>`;
                quickReplies.innerHTML = `
                    <button onclick="insertSampleReport()" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-full border border-indigo-200 transition-colors">📋 Tempel Contoh Laporan Zidan</button>
                    ${systemData.observasi_guru ? `<button onclick="viewJSONData()" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-full border border-emerald-200 transition-colors">🔍 Cek JSON Guru</button>` : ''}
                `;
            } else if (currentRole === 'psikolog') {
                roleBanner.innerHTML = `<span><i class="fa-solid fa-user-doctor mr-1"></i> Mode <strong>Psikolog (+AI)</strong>: Analisis & Validasi.</span><span class="text-slate-400">${systemData.metadata.tanggal}</span>`;
                
                if (!systemData.observasi_guru) {
                    quickReplies.innerHTML = `<span class="text-xs text-slate-400 py-1.5">Meminta guru menginput laporan...</span>`;
                } else {
                    quickReplies.innerHTML = `
                        <button onclick="runAIAnalysis()" class="px-3 py-1.5 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-full border border-purple-300 transition-colors font-medium">🤖 Analisis dengan AI</button>
                        ${systemData.analisis_psikolog ? `<button onclick="forwardToParents()" class="px-3 py-1.5 bg-emerald-600 text-white hover:bg-emerald-700 rounded-full transition-colors font-medium">📩 Teruskan ke Orang Tua</button>` : ''}
                        <button onclick="viewJSONData()" class="px-3 py-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-full border border-slate-300 transition-colors">🔍 Lihat Full JSON Payload</button>
                    `;
                }
            } else {
                roleBanner.innerHTML = `<span><i class="fa-solid fa-house-chimney-user mr-1"></i> Mode <strong>Orang Tua</strong>: Laporan Perkembangan.</span><span class="text-slate-400">${systemData.metadata.tanggal}</span>`;
                
                if (systemData.metadata.status_pipeline === "terkirim_ke_ortu") {
                    quickReplies.innerHTML = `
                        <button onclick="showParentReport()" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-full border border-indigo-200 transition-colors">📌 Buka Laporan Perkembangan</button>
                        <button onclick="showHomeActivities()" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-full border border-emerald-200 transition-colors">🏠 Latihan yang Disarankan di Rumah</button>
                    `;
                } else {
                    quickReplies.innerHTML = `<span class="text-xs text-amber-600 bg-amber-50 px-3 py-1.5 rounded-full border border-amber-200"><i class="fa-solid fa-clock mr-1"></i> Laporan sedang diproses oleh Tim Guru & Psikolog...</span>`;
                }
            }
        }

        function switchRole(role) {
            currentRole = role;
            initChat();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendUserMessage(text) {
            const msgHTML = `
                <div class="flex items-start gap-2.5 justify-end">
                    <div class="bg-indigo-600 text-white p-3.5 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] text-sm whitespace-pre-wrap">
                        ${text}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', msgHTML);
            scrollToBottom();
        }

        function appendBotMessage(text, senderLabel = "System") {
            const msgHTML = `
                <div class="flex items-start gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs shrink-0 font-bold">
                        ${senderLabel.substring(0,2)}
                    </div>
                    <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] text-slate-800 text-sm space-y-2 border border-slate-100">
                        ${text}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', msgHTML);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const indicatorHTML = `
                <div id="typingIndicator" class="flex items-start gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs shrink-0 font-bold">
                        AI
                    </div>
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-slate-400 text-xs flex gap-1 items-center">
                        <span class="animate-bounce">●</span>
                        <span class="animate-bounce delay-100">●</span>
                        <span class="animate-bounce delay-200">●</span>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', indicatorHTML);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // 1. Parsing Input Guru ke JSON
        function parseTeacherInput(text) {
            systemData.observasi_guru = {
                raw_text: text,
                kepatuhan: extractSection(text, ['kepatuhan', 'ketenangan']),
                fokus: extractSection(text, ['fokus', 'kontak mata']),
                kognitif: extractSection(text, ['kognitif']),
                motorik: extractSection(text, ['motorik', 'koordinasi', 'keseimbangan']),
                komunikasi: extractSection(text, ['komunikasi', 'interaksi', 'mengulang'])
            };

            systemData.metadata.status_pipeline = "menunggu_psikolog";
            updateRoleUI();
        }

        function extractSection(text, keywords) {
            const lines = text.split('\n');
            let result = "";
            let isTarget = false;

            for (let line of lines) {
                const lower = line.toLowerCase();
                if (line.startsWith('*') || line.startsWith('#')) {
                    isTarget = keywords.some(k => lower.includes(k));
                    continue;
                }
                if (isTarget && line.trim() !== "") {
                    result += line + " ";
                }
            }
            return result.trim() || text; 
        }

        // 2. Simulasi Analisis AI untuk Psikolog
        function runAIAnalysis() {
            showTypingIndicator();

            setTimeout(() => {
                removeTypingIndicator();

                const obs = systemData.observasi_guru;
                
                // Cerdas Menganalisis Konten
                systemData.analisis_psikolog = {
                    temuan_klinis: [
                        "<strong>Progres Regulasi Diri:</strong> Emosi dan kepatuhan dalam mengikuti instruksi membaik setelah diberikan umpan balik/direduksi keterburu-buruannya.",
                        "<strong>Progres Komunikasi:</strong> Terdapat indikasi <em>echolalia minor</em> di awal interaksi, namun mampu langsung beradaptasi setelah diberi arahan verbal sederhana.",
                        "<strong>Motorik Kasar:</strong> Koordinasi mata-tangan berkembang baik, namun memerlukan penguatan pada keseimbangan postural tubuh."
                    ],
                    rekomendasi_ortu: [
                        "<strong>Latihan Keseimbangan:</strong> Ajak anak berjalan di atas garis lurus/papan titian di rumah (10 menit/hari).",
                        "<strong>Pacing Komunikasi:</strong> Berikan jeda 2-3 detik setelah bertanya agar anak dapat memproses pertanyaan tanpa mengulang kalimat.",
                        "<strong>Regulasi Ketenangan:</strong> Ajarkan napas dalam saat anak terlihat terburu-buru ingin menyelesaikan sesuatu."
                    ]
                };

                appendBotMessage(`
                    <strong>🤖 Draf Analisis AI Berhasil Dibuat untuk Psikolog:</strong><br><br>
                    <strong>🔍 Temuan Klinis (AI Detection):</strong>
                    <ul class="list-disc ml-4 space-y-1 my-2">
                        <li>${systemData.analisis_psikolog.temuan_klinis.join('</li><li>')}</li>
                    </ul>
                    <br>
                    <strong>💡 usulan Saran untuk Orang Tua:</strong>
                    <ul class="list-disc ml-4 space-y-1 my-2">
                        <li>${systemData.analisis_psikolog.rekomendasi_ortu.join('</li><li>')}</li>
                    </ul>
                    <br>
                    <em>Psikolog dapat meninjau hasil di atas lalu mengeklik <strong>"📩 Teruskan ke Orang Tua"</strong> untuk merilis laporan.</em>
                `, 'Psikolog');

                updateRoleUI();
            }, 800);
        }

        // 3. Meneruskan ke Orang Tua
        function forwardToParents() {
            systemData.metadata.status_pipeline = "terkirim_ke_ortu";
            updateRoleUI();
            
            appendBotMessage(`
                ✅ <strong>Laporan Berhasil Diteruskan!</strong><br>
                Laporan perkembangan dan analisis rekomendasi telah dipublikasikan ke tampilan <strong>Orang Tua</strong>.
            `, 'Psikolog');
        }

        function handleSend(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendUserMessage(text);

            if (currentRole === 'guru') {
                parseTeacherInput(text);
                
                showTypingIndicator();
                setTimeout(() => {
                    removeTypingIndicator();
                    appendBotMessage(`
                        ✅ <strong>Laporan Observasi Berhasil Disimpan & Dikonversi ke JSON!</strong><br><br>
                        Data telah diteruskan ke tahap **Psikolog**. Silakan beralih role ke **2. Psikolog + AI** pada tombol navigasi di atas.
                    `, 'Guru');
                }, 500);

            } else if (currentRole === 'psikolog') {
                appendBotMessage(`Catatan tambahan dari Psikolog: "${text}" berhasil disimpan.`, 'Psikolog');
            } else {
                appendBotMessage(`Pertanyaan Bapak/Ibu terkirim ke Tim Guru & Psikolog.`, 'Orang Tua');
            }
        }

        function insertSampleReport() {
            const sampleText = `Report Zidan, 09 mei 2026

*kepatuhan dan ketenangan*
Hari ini zidan mampu menyelesaikan kegiatan dengan cukup tenang dan mengikuti instruksi yang diberikan oleh coach, hanya pada beberapa waktu zidan terlihat buru² saat menjawab pertanyaan dan juga saat mengerjakan kegiatan, namun setelah diarahkan oleh coach zidan mampu melanjutkan kegiatan dengan lebih tenang

*Kefokusan dan kontak mata*
Zidan mampu fokus dengan durasi cukup lama saat menyelesaikan kegiatan, kontak mata zidan juga cukup konsisten dalam beberapa, hanya perlu sesekali dingatkan kembali

*kognitif dan motorik*
Zidan mampu memahami dan mengikuti instruksi dari coach dengan baik. Zidan mampu menjawab kartu pertanyaan yang diberikan coach, dan mampu merangkai kalimat berdasarkan dengan arahan coach

Koordinasi tangan mata zidan cukup bagus, namun butuh latihan kembali untuk keseimbangan tubuh zidan

*komunikasi dan interaksi*
Zidan mampu memberikan respon yang cukup sesuai saat berkomunikasi dengan coach, meski diawal masih mengulang kalimat yang di ucapkan coach, namun setelah diarahkan zidan mampu menjawab dengan benar dan tepat`;

            userInput.value = sampleText;
        }

        function viewJSONData() {
            const jsonString = JSON.stringify(systemData, null, 2);
            appendBotMessage(`
                <strong>📦 Payload Data JSON Sistem (Real-time):</strong>
                <pre class="bg-slate-900 text-emerald-400 p-3 rounded-lg text-xs overflow-x-auto mt-2 font-mono">${jsonString}</pre>
            `, 'System');
        }

        function showParentReport() {
            const obs = systemData.observasi_guru;
            appendBotMessage(`
                <strong>📌 Laporan Perkembangan Siswa (${systemData.metadata.tanggal}):</strong><br><br>
                🌟 <strong>Perkembangan Hari Ini (Observasi Guru):</strong><br>
                • <strong>Kepatuhan & Fokus:</strong> ${obs.kepatuhan}<br>
                • <strong>Kognitif & Kemampuan:</strong> ${obs.kognitif}<br>
                • <strong>Komunikasi:</strong> ${obs.komunikasi}<br><br>
                🧠 <strong>Catatan dari Tim Psikolog:</strong><br>
                Anak menunjukkan perkembangan yang sangat positif dalam pemahaman instruksi. Beberapa catatan kecil seperti keterburu-buruan dan pengulangan kalimat merupakan hal yang wajar dan dapat dilatih bersama-sama secara konsisten.
            `, 'Orang Tua');
        }

        function showHomeActivities() {
            const rec = systemData.analisis_psikolog.rekomendasi_ortu;
            const list = rec.map(item => `<li class="ml-4 list-disc my-1">${item}</li>`).join('');
            appendBotMessage(`
                <strong>🏠 Rekomendasi Latihan di Rumah (Dari Psikolog):</strong><br><br>
                <ul>${list}</ul>
            `, 'Orang Tua');
        }

        // Initialize App
        initChat();
    </script>
</body>
</html>
